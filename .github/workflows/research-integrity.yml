name: research-integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Validate governance and metrics
        run: python3 scripts/validate.py
      - name: Test child integrity
        run: python3 -m unittest discover -s tests -v
